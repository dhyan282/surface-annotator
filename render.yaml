services:
  - type: web
    name: surface-annotator
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: "100"
    healthCheckPath: /
    autoDeploy: true