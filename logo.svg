  <text x="100" y="170" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="sans-serif" font-weight="600">SURFACE</text>
  <text x="100" y="185" text-anchor="middle" fill="#00e5ff" font-size="10" font-family="sans-serif">ANNOTATOR</text>
